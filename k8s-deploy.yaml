# n8n MCP Admin GUI — Kubernetes Deployment（namespace：kasim-odoo）
#
# 共用 RBAC（ServiceAccount / Role / RoleBinding）已抽到 k8s-rbac.yaml，
# 每個 namespace 先套用一次後再套用本檔：
#     kubectl apply -f k8s-rbac.yaml
#     kubectl apply -f k8s-deploy.yaml
#
# 注意：本檔只負責 n8n-mcp-admin 自己的 Deployment/Service；odoo-mcp-admin
# 由 woow_odoo_mcp_server/k8s-deploy.yaml 各自管理，互不影響。
---
# n8n MCP Admin (port 9002)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-mcp-admin
  namespace: kasim-odoo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-mcp-admin
  template:
    metadata:
      labels:
        app: n8n-mcp-admin
    spec:
      serviceAccountName: mcp-admin-sa
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
      - name: admin
        image: jcr-prod.woowtech.io/woow-paas-docker-local/n8n-mcp-admin:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9002
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ADMIN_SECRET_NAME
          value: n8n-secrets
        - name: MCP_DEPLOY_NAME
          value: n8n-mcp
        - name: MCP_PROXY_DEPLOY_NAME
          value: n8n-mcp-proxy
        - name: MCP_SECRET_NAME
          value: n8n-secrets
        - name: MCP_PROXY_CONFIG_NAME
          value: n8n-mcp-proxy-config
        - name: N8N_SVC_URL
          value: http://n8n.kasim-odoo.svc.cluster.local:5678
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9002
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9002
          initialDelaySeconds: 15
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-mcp-admin-svc
  namespace: kasim-odoo
spec:
  selector:
    app: n8n-mcp-admin
  ports:
  - port: 9002
    targetPort: 9002
