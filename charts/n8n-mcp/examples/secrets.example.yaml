# -----------------------------------------------------------------------------
# Secret material for the n8n-mcp chart - PLACEHOLDERS ONLY. Never commit real
# values, and never put them in deploy/woow-k3s/*.yaml either.
#
# Used with the defaults secrets.create=false and proxy.config.create=false: the
# chart then only references these two objects by name. Copy this file OUTSIDE
# the repo, replace every REPLACE_ME, then apply the copy:
#   kubectl --context woow-k3s apply -f /secure/path/n8n-mcp-secrets.yaml
#
# Names per instance (namespace / Secret / ConfigMap):
#   woowtech-odoo  n8n-secrets            n8n-mcp-proxy-config
#   cindytech      cindytech-n8n-secrets  cindytech-n8n-mcp-proxy-config
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: woowtech-odoo
type: Opaque
stringData:
  # n8n REST API key (n8n GUI: Settings > n8n API). Scopes: workflow:*,
  # execution:*, credential:create, tag/variable/project/user list.
  N8N_API_KEY: "REPLACE_ME_n8n_api_..."
  # Bearer token the MCP server requires (AUTH_TOKEN). openssl rand -hex 32.
  # It must be the SAME value as the Bearer token in the nginx.conf below.
  MCP_AUTH_TOKEN: "REPLACE_ME_64_HEX_CHARS"
---
# The proxy config. Both the secret URL path and the bearer token live here, so
# it is secret material even though it is a ConfigMap:
#   public URL = https://<host>/private_<pathSecret>/mcp
# Keep the pathSecret unguessable (openssl rand -hex 10) and never log the URL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-mcp-proxy-config
  namespace: woowtech-odoo
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      client_max_body_size 50m;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }
      server {
        listen 3001;

        # Add this location when the nginx container has HTTP probes
        # (proxy.probes.enabled=true, the default):
        # location /health { return 200 'ok'; }

        location /.well-known/ {
          return 404 '{"error":"not found"}';
        }

        location /register {
          return 404 '{"error":"not found"}';
        }

        location /private_REPLACE_ME_PATH_SECRET/ {
          rewrite ^/private_REPLACE_ME_PATH_SECRET/(.*) /$1 break;
          # sidecar: http://127.0.0.1:3000 - standalone: http://<mcp service>:3000
          proxy_pass http://n8n-mcp:3000;
          proxy_set_header Authorization "Bearer REPLACE_ME_SAME_AS_MCP_AUTH_TOKEN";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header Connection '';
          proxy_http_version 1.1;
          chunked_transfer_encoding off;
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 86400s;
          proxy_send_timeout 86400s;
        }

        location / {
          return 404 '{"error":"not found"}';
        }
      }
    }
