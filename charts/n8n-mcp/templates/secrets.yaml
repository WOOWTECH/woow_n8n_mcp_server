{{- /*
The n8n API key and the MCP auth token, rendered only with secrets.create=true.
By default the Secret already exists (examples/secrets.example.yaml) and the
chart never renders it, so an upgrade cannot overwrite real keys with empty
values. The woowtech-odoo instance shares n8n-secrets with the n8n release.
*/ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "n8n-mcp.secretName" . }}
  namespace: {{ include "n8n-mcp.ns" . }}
  labels:
    {{- include "n8n-mcp.objectLabels" (dict "ctx" . "extra" (dict)) | nindent 4 }}
  {{- include "n8n-mcp.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  {{ $s.keys.n8nApiKey }}: {{ required "secrets.n8nApiKey is required when secrets.create=true" $s.n8nApiKey | quote }}
  {{ $s.keys.mcpAuthToken }}: {{ required "secrets.mcpAuthToken is required when secrets.create=true" $s.mcpAuthToken | quote }}
{{- end }}
